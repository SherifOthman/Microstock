<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Aperture / Shutter Blade Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>

    <filter id="sparkle-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base with Sleek Border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Outer Camera Aperture Ring / Microstock Framework -->
  <g filter="url(#shadow)">
    <!-- Aperture Blade 1 (Top Blue) -->
    <path d="M 64 22 C 78 22, 92 27, 102 37 L 85 54 C 80 48, 72 45, 64 45 Z" fill="url(#primary-glow)" opacity="0.95" />
    <!-- Aperture Blade 2 (Right Cyan) -->
    <path d="M 106 64 C 106 78, 101 92, 91 102 L 74 85 C 80 80, 83 72, 83 64 Z" fill="url(#primary-glow)" opacity="0.85" />
    <!-- Aperture Blade 3 (Bottom Emerald) -->
    <path d="M 64 106 C 50 106, 36 101, 26 91 L 43 74 C 48 80, 56 83, 64 83 Z" fill="url(#emerald-glow)" opacity="0.9" />
    <!-- Aperture Blade 4 (Left Violet) -->
    <path d="M 22 64 C 22 50, 27 36, 37 26 L 54 43 C 48 48, 45 56, 45 64 Z" fill="url(#violet-glow)" opacity="0.9" />
  </g>

  <!-- Central Camera Core / Stock Layer Hub -->
  <circle cx="64" cy="64" r="18" fill="#090d16" stroke="#334155" stroke-width="2" />
  <circle cx="64" cy="64" r="13" fill="#0284c7" opacity="0.25" />

  <!-- Intelligent AI Sparkle Star Center (Vision & Intelligence) -->
  <path d="M 64 49 Q 64 64 49 64 Q 64 64 64 79 Q 64 64 79 64 Q 64 64 64 49 Z" fill="url(#sparkle-grad)" filter="url(#sparkle-shadow)" />

  <!-- Accent Generative Sparkle Satellite (Top Right) -->
  <path d="M 94 28 Q 94 34 88 34 Q 94 34 94 40 Q 94 34 100 34 Q 94 34 94 28 Z" fill="#38bdf8" />
  <circle cx="94" cy="34" r="1.5" fill="#ffffff" />
</svg>