      (function() {
        if (typeof Node !== 'undefined' && Node.prototype) {
          var origRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function(child) {
            try {
              if (!child) return child;
              if (child.parentNode !== this) {
                if (child.parentNode) {
                  try { return child.parentNode.removeChild(child); } catch (e) { return child; }
                }
                return child;
              }
              return origRemoveChild.call(this, child);
            } catch (err) {
              return child;
            }
          };

          var origInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, refNode) {
            try {
              if (!newNode) return newNode;
              if (refNode && refNode.parentNode !== this) {
                if (refNode.parentNode && this.contains(refNode.parentNode)) {
                  var cur = refNode.parentNode;
                  while (cur.parentNode && cur.parentNode !== this) {
                    cur = cur.parentNode;
                  }
                  if (cur.parentNode === this) {
                    return origInsertBefore.call(this, newNode, cur);
                  }
                }
                return origInsertBefore.call(this, newNode, null);
              }
              return origInsertBefore.call(this, newNode, refNode);
            } catch (err) {
              try { return origInsertBefore.call(this, newNode, null); } catch (e2) { return newNode; }
            }
          };
        }
      })();
